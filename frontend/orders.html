<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Orders | CodeAlpha Store</title>

    <link
        rel="stylesheet"
        href="css/style.css">

    <style>

        .orders-section {
            padding: 50px 8%;
            min-height: 600px;
        }

        .orders-section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .orders-container {
            max-width: 900px;
            margin: auto;
        }

        .order-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .order-card h3 {
            margin-bottom: 10px;
        }

        .order-card p {
            margin: 7px 0;
            color: #4b5563;
        }

        .order-status {
            display: inline-block;
            background: #dcfce7;
            color: #166534;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 8px;
        }

        .empty-orders {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
        }

        .loading {
            text-align: center;
            font-size: 18px;
        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <header>

        <nav class="navbar">

            <h1>CodeAlpha Store</h1>

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="cart.html">
                    Cart 🛒
                </a>

                <a href="orders.html">
                    My Orders
                </a>

            </div>

        </nav>

    </header>


    <!-- Orders -->

    <main>

        <section class="orders-section">

            <h2>
                My Orders
            </h2>

            <div
                id="ordersContainer"
                class="orders-container">

                <p class="loading">
                    Loading orders...
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 CodeAlpha Store.
            All Rights Reserved.
        </p>

    </footer>


    <script>

        const API_URL =
            "https://super-duper-space-waffle-96j5px6q9q4rcx5qx-3000.app.github.dev";


        const token =
            localStorage.getItem("token");


        const ordersContainer =
            document.getElementById(
                "ordersContainer"
            );


        async function loadOrders() {

            if (!token) {

                ordersContainer.innerHTML = `

                    <div class="empty-orders">

                        <h3>
                            Please login
                        </h3>

                        <p>
                            Login to view your orders.
                        </p>

                        <br>

                        <a
                            href="login.html"
                            class="btn">
                            Login
                        </a>

                    </div>

                `;

                return;

            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/api/orders`,
                        {

                            method: "GET",

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`

                            }

                        }
                    );


                const orders =
                    await response.json();


                if (!response.ok) {

                    ordersContainer.innerHTML = `

                        <div class="empty-orders">

                            <h3>
                                Unable to load orders
                            </h3>

                            <p>
                                Please login again.
                            </p>

                        </div>

                    `;

                    return;

                }


                if (orders.length === 0) {

                    ordersContainer.innerHTML = `

                        <div class="empty-orders">

                            <h3>
                                No orders yet 🛍️
                            </h3>

                            <p>
                                Start shopping to
                                place your first order.
                            </p>

                            <br>

                            <a
                                href="products.html"
                                class="btn">
                                Browse Products
                            </a>

                        </div>

                    `;

                    return;

                }


                ordersContainer.innerHTML = "";


                orders.forEach(order => {

                    const orderCard =
                        document.createElement(
                            "div"
                        );


                    orderCard.className =
                        "order-card";


                    orderCard.innerHTML = `

                        <h3>
                            Order #${order.id}
                        </h3>

                        <p>
                            Total:
                            <strong>
                                ₹${Number(order.total)
                                    .toLocaleString("en-IN")}
                            </strong>
                        </p>

                        <p>
                            Date:
                            ${new Date(
                                order.created_at
                            ).toLocaleString()}
                        </p>

                        <span class="order-status">
                            ${order.status}
                        </span>

                    `;


                    ordersContainer.appendChild(
                        orderCard
                    );

                });

            } catch (error) {

                console.error(error);

                ordersContainer.innerHTML = `

                    <div class="empty-orders">

                        <h3>
                            Server connection error
                        </h3>

                    </div>

                `;

            }

        }


        loadOrders();

    </script>

</body>

</html>
