<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | CodeAlpha Store</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">

            <h1>CodeAlpha Store</h1>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart 🛒</a>
                <a href="login.html">Login</a>
            </div>

        </nav>
    </header>


    <!-- Products Section -->
    <main>

        <section class="featured">

            <h2>Our Products</h2>

<div class="product-container" id="productContainer">
    <p>Loading products...</p>
</div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>© 2026 CodeAlpha Store. All Rights Reserved.</p>

    </footer>


    <!-- JavaScript -->
<script>

    const API_URL =
        "https://super-duper-space-waffle-96j5px6q9q4rcx5qx-3000.app.github.dev";

    const productContainer =
        document.getElementById("productContainer");


    async function loadProducts() {

        try {

            const response =
                await fetch(`${API_URL}/api/products`);

            const products =
                await response.json();


            productContainer.innerHTML = "";


            products.forEach(product => {

                const card =
                    document.createElement("div");

                card.className = "product-card";


                card.innerHTML = `

                    <img
                        src="${product.image}"
                        alt="${product.name}">

                    <h3>${product.name}</h3>

                    <p>
                        ₹${Number(product.price)
                            .toLocaleString("en-IN")}
                    </p>

                    <button
                        onclick="addToCart(
                            ${product.id},
                            '${product.name.replace(/'/g, "\\'")}',
                            ${product.price}
                        )">
                        Add to Cart
                    </button>

                `;


                productContainer.appendChild(card);

            });

        } catch (error) {

            console.error(error);

            productContainer.innerHTML = `
                <p>
                    Unable to load products.
                    Please try again.
                </p>
            `;

        }

    }


    function addToCart(id, name, price) {

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        cart.push({

            product_id: id,
            name: name,
            price: price,
            quantity: 1

        });


        localStorage.setItem(
            "cart",
            JSON.stringify(cart)
        );


        alert(
            name + " added to cart!"
        );

    }


    loadProducts();

</script>

</body>

</html>
