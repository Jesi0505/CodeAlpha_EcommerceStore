<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | CodeAlpha Store</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-section {
            min-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #1d4ed8;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <!-- Navigation -->
    <header>

        <nav class="navbar">

            <h1>CodeAlpha Store</h1>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart 🛒</a>
                <a href="login.html">Login</a>
            </div>

        </nav>

    </header>


    <!-- Registration Form -->
    <main>

        <section class="auth-section">

            <div class="auth-box">

                <h2>Create Account</h2>

                <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your name"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            minlength="6"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="6"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="register-btn">
                        Create Account
                    </button>

                </form>


                <p id="message"></p>


                <div class="login-link">

                    <p>
                        Already have an account?
                        <a href="login.html">
                            Login
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>© 2026 CodeAlpha Store. All Rights Reserved.</p>

    </footer>


    <script>

        document
            .getElementById("registerForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const name =
                    document.getElementById("name").value;

                const email =
                    document.getElementById("email").value;

                const password =
                    document.getElementById("password").value;

                const confirmPassword =
                    document.getElementById("confirmPassword").value;

                const message =
                    document.getElementById("message");


                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color = "#dc2626";

                    return;
                }


                /*
                 * Temporary frontend validation.
                 * This will be connected to the
                 * Express.js backend later.
                 */

                message.textContent =
                    "Registration will be connected to the server.";

                message.style.color = "#2563eb";

            });

    </script>

</body>

</html>
