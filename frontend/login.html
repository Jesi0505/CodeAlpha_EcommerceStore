<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | CodeAlpha Store</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-section {
            min-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .auth-box h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <!-- Navigation -->
    <header>

        <nav class="navbar">

            <h1>CodeAlpha Store</h1>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart 🛒</a>
                <a href="login.html">Login</a>
            </div>

        </nav>

    </header>


    <!-- Login Form -->
    <main>

        <section class="auth-section">

            <div class="auth-box">

                <h2>Login</h2>

                <form id="loginForm">

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <button
                        type="submit"
                        class="login-btn">
                        Login
                    </button>

                </form>


                <p id="message"></p>


                <div class="register-link">

                    <p>
                        Don't have an account?
                        <a href="register.html">
                            Create Account
                        </a>
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>© 2026 CodeAlpha Store. All Rights Reserved.</p>

    </footer>


<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("message");


            try {

                const response = await fetch(
                    "https://super-duper-space-waffle-96j5px6q9q4rcx5qx-3000.app.github.dev/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );


                const data = await response.json();


                if (response.ok) {

                    localStorage.setItem(
                        "token",
                        data.token
                    );

                    localStorage.setItem(
                        "user",
                        JSON.stringify(data.user)
                    );

                    message.textContent =
                        "Login successful!";

                    message.style.color = "#16a34a";

                    setTimeout(function() {

                        window.location.href =
                            "products.html";

                    }, 1000);

                } else {

                    message.textContent =
                        data.message ||
                        "Invalid email or password.";

                    message.style.color = "#dc2626";

                }

            } catch (error) {

                console.error(error);

                message.textContent =
                    "Unable to connect to the server.";

                message.style.color = "#dc2626";

            }

        });

</script>
</body>

</html>
