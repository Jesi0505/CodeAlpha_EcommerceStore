<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | CodeAlpha Store</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        .cart-section {
            padding: 50px 8%;
            min-height: 500px;
        }

        .cart-section h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .cart-container {
            max-width: 900px;
            margin: auto;
        }

        .cart-item {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .cart-item h3 {
            margin-bottom: 8px;
        }

        .cart-price {
            color: #2563eb;
            font-weight: bold;
        }

        .remove-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #b91c1c;
        }

        .cart-summary {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 25px;
            text-align: right;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .cart-summary h3 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .checkout-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .checkout-btn:hover {
            background: #1d4ed8;
        }

        .empty-cart {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .cart-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>

</head>

<body>

    <!-- Navigation -->
    <header>

        <nav class="navbar">

            <h1>CodeAlpha Store</h1>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart 🛒</a>
                <a href="login.html">Login</a>
            </div>

        </nav>

    </header>


    <!-- Cart -->
    <main>

        <section class="cart-section">

            <h2>Your Shopping Cart</h2>

            <div class="cart-container">

                <div id="cartItems"></div>

                <div class="cart-summary">

                    <h3>
                        Total: ₹<span id="cartTotal">0</span>
                    </h3>

                    <button
                        class="checkout-btn"
                        onclick="checkout()">
                        Proceed to Checkout
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>© 2026 CodeAlpha Store. All Rights Reserved.</p>

    </footer>


    <script>

        // Get cart from browser storage
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        const cartItems = document.getElementById("cartItems");
        const cartTotal = document.getElementById("cartTotal");


        // Display cart
        function displayCart() {

            cartItems.innerHTML = "";

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty-cart">
                        <h3>Your cart is empty 🛒</h3>
                        <p>Add some products to continue shopping.</p>
                        <br>
                        <a href="products.html" class="btn">
                            Browse Products
                        </a>
                    </div>
                `;

                cartTotal.textContent = "0";

                return;
            }


            let total = 0;


            cart.forEach((product, index) => {

                total += product.price;

                const item = document.createElement("div");

                item.className = "cart-item";

                item.innerHTML = `

                    <div>
                        <h3>${product.name}</h3>
                        <p class="cart-price">
                            ₹${product.price.toLocaleString("en-IN")}
                        </p>
                    </div>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">
                        Remove
                    </button>

                `;

                cartItems.appendChild(item);

            });


            cartTotal.textContent = total.toLocaleString("en-IN");

        }


        // Remove product
        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            displayCart();

        }


        // Checkout
        function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;
            }

            window.location.href = "login.html";

        }


        // Load cart
        displayCart();

    </script>

</body>

</html>
